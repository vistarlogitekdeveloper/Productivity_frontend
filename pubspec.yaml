name: productivity_tracker
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  dio: ^5.9.2
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.4
  riverpod_annotation: ^4.0.2
  intl: ^0.20.2
  fl_chart: ^1.2.0
  excel: ^4.0.6
  # Used to patch the worksheet XML emitted by `excel` so the Monthly DPL
  # Chart export can carry freeze panes (the excel package doesn't expose
  # them). `archive` is already a transitive dep — listed here explicitly
  # so the analyzer is happy.
  archive: ^3.6.1
  pdf: ^3.11.3
  # Added by the DPL Manager module — Excel picker for the Upload Plan screen.
  file_picker: ^8.1.4
  # Added by the DPL Supervisor module — keep screen awake during active
  # production so the shop-floor operator can see the live timer.
  wakelock_plus: ^1.2.5
  # Selfie capture for the DPL identity-verification gate (front camera
  # on Android / iOS, MediaDevices.getUserMedia on web).
  image_picker: ^1.1.2
  # DPL UI overhaul — Inter (UI) + Roboto Mono (timers/numbers).
  google_fonts: ^6.2.1
  # Loading skeletons on DPL screens.
  shimmer: ^3.0.0
  # QR code rendering on the dispatch slip (Dispatch → QA → PDI flow).
  # The payload is an HMAC-signed JWT-style token the backend generates
  # on PDI approval; we just render it as a scannable square.
  qr_flutter: ^4.1.0
  # System print dialog for the printable dispatch slip — wraps a `pdf`
  # document and hands it to Android/iOS/web's native print sheet.
  printing: ^5.13.4
  # Camera-based QR scanning for the in-app dispatch-slip verifier.
  # Hits the backend's public `/dispatch/slips/verify` endpoint with the
  # scanned token and renders the verified slip in human-readable form
  # (names, not IDs).
  mobile_scanner: ^6.0.10
  # ── Live trip tracking (driver → manager breadcrumb map).
  # `geolocator` supplies the position stream AND, on Android, the
  # foreground-service + notification that keeps the stream alive with the
  # screen off. That foreground service is why we only ever need
  # while-in-use location — no ACCESS_BACKGROUND_LOCATION, so no Play
  # Store background-location declaration. See
  # `lib/features/dpl/tracking/services/trip_location_tracker.dart`.
  geolocator: ^14.0.2
  # OpenStreetMap tile renderer — deliberately NOT google_maps_flutter:
  # no API key, no billing account, no per-load cost. Tile fetches must
  # carry our real user-agent per the OSM tile usage policy (set in
  # `trip_track_map_screen.dart`).
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  # Vistar Workspace launcher — opens the sibling Vistar web apps
  # (KRA, VTMS, Vistar Hire, …) in the browser / an external tab with a
  # signed SSO hand-off appended. See
  # `lib/features/workspace/services/vistar_sso_handoff.dart`.
  url_launcher: ^6.3.1
  # In-house usage analytics (Platform Console > Analytics > Event tracker).
  # Vendored: the SDK repository is private, so the Cloudflare build cannot
  # fetch it (packages/vistar_event_tracker/VENDORED.md). Off unless the build
  # gets ET_APP_ID + ET_WRITE_KEY (lib/core/telemetry/telemetry.dart).
  vistar_event_tracker:
    path: packages/vistar_event_tracker

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  riverpod_generator: ^4.0.3
  # Generates Android / iOS / Web launcher icons from a single PNG. Run
  # `dart run flutter_launcher_icons` after updating `assets/images/vistar_logo.png`
  # to regenerate the home-screen icons.
  flutter_launcher_icons: ^0.14.1

# Launcher icon configuration. Source PNG should be square (≥1024×1024
# is ideal). Re-run `dart run flutter_launcher_icons` whenever the file
# at `image_path` changes.
flutter_launcher_icons:
  android: true
  ios: true
  # App Store rejects iOS launcher icons that carry an alpha channel.
  # `remove_alpha_ios` flattens transparency onto white before encoding.
  remove_alpha_ios: true
  image_path: assets/images/vistar_logo.png
  # Adaptive icon support for Android 8+ — same PNG layered onto a
  # white background so the system can apply the platform mask.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/vistar_logo.png
  # Web favicon — drop the same image into the PWA manifest icons.
  web:
    generate: true
    image_path: assets/images/vistar_logo.png
    background_color: "#FFFFFF"
    theme_color: "#6B1F8C"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Vistar brand assets — drop 1x / 2x / 3x PNGs at these paths.
    # The VistarLogo widget falls back to a text placeholder if any
    # variant is missing so screens never crash before the files land.
    - assets/images/
    - assets/images/2.0x/
    - assets/images/3.0x/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
